<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23E11D48'/><path d='M30 50h40M50 30v40' stroke='white' stroke-width='12' stroke-linecap='square'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
    <title>TRANSLATION TRAINING // 英译中 · 中译英双向翻译竞技场</title>
    <meta
      name="description"
      content="考研英语（一）翻译训练与双人实时对战平台：2002–2026 年真题、AI 阅卷点评、英译中与中译英双向练习。非官方、非经营性学习站点。"
    />
    <!-- Site identity (ICP filing number etc.) is injected by the server at runtime. -->
    <script src="/site-info.js"></script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('tt_theme');
          var supportDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-swiss-paper dark:bg-swiss-paper-dark text-swiss-black dark:text-zinc-100 font-sans antialiased selection:bg-swiss-red selection:text-white min-h-screen transition-colors duration-150">

    <script type="module" src="/src/client/main.tsx"></script>
  </body>
